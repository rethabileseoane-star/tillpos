[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "till-accounting"
version = "0.1.0"
description = "Offline double-entry accounting statements for Till POS backups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
till-accounting = "till_accounting.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["till_accounting*"]
